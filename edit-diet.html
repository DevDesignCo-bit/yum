<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumetics — What type of diet do you prefer?</title>
            <link rel="stylesheet" href="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.2e098a9d.css">
    </head>
<body class="onboarding-page">
    <div class="onboarding-viewport">
                    <header class="onboarding-header pt-4 pt-md-5">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="onboarding-header-slot">
                    <a href="/profile" class="app-icon-btn" aria-label="Back">
        <span class="icon-arrow icon-arrow-left" aria-hidden="true"></span>
    </a>
            </div>
            <div class="onboarding-header-slot">
                    <a href="/profile" class="app-icon-btn" aria-label="Close">
        <span class="icon-close" aria-hidden="true"></span>
    </a>
            </div>
        </div>
    </header>


        <main class="onboarding-main flex-grow-1 d-flex flex-column align-items-md-center w-100">
                                
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6 mx-auto">
                <h1 class="onboarding-step-title mt-3 text-center mb-5 pb-3">What type of diet do you prefer?</h1>

                <form id="onboarding-form" method="get" action="/profile" class="needs-validation block-submit-button-until-form-filled" novalidate>
                                            <div class="form-field">
                            <div class="option-cards-grid" data-required-group>
                                                                                                                                                                                                                                                                                                                                                            <label class="option-card">
        <input type="checkbox" name="diet[]" value="balanced" class="visually-hidden">
        <span class="option-card-body">
            <span class="option-card-header">
                <img class="option-card-icon" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/icons/balanced.png" alt="" width="40" height="40">                <span class="option-card-title">Balanced</span>
            </span>
                    </span>
    </label>

                                                                                                                                                                                                                                                                                                                                                            <label class="option-card">
        <input type="checkbox" name="diet[]" value="ketogenic" class="visually-hidden">
        <span class="option-card-body">
            <span class="option-card-header">
                <img class="option-card-icon" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/icons/ketogenic.png" alt="" width="40" height="40">                <span class="option-card-title">Ketogenic</span>
            </span>
                    </span>
    </label>

                                                                                                                                                                                                                                                                                                                                                            <label class="option-card">
        <input type="checkbox" name="diet[]" value="vegetarian" class="visually-hidden">
        <span class="option-card-body">
            <span class="option-card-header">
                <img class="option-card-icon" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/icons/vegetarian.png" alt="" width="40" height="40">                <span class="option-card-title">Vegetarian</span>
            </span>
                    </span>
    </label>

                                                                                                                                                                                                                                                                                                                                                            <label class="option-card">
        <input type="checkbox" name="diet[]" value="high_protein" class="visually-hidden">
        <span class="option-card-body">
            <span class="option-card-header">
                <img class="option-card-icon" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/icons/protein-icon.png" alt="" width="40" height="40">                <span class="option-card-title">High Protein</span>
            </span>
                    </span>
    </label>

                                                                                                                                                                                                                                                                                                                                                            <label class="option-card">
        <input type="checkbox" name="diet[]" value="vegan" class="visually-hidden" checked>
        <span class="option-card-body">
            <span class="option-card-header">
                <img class="option-card-icon" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/icons/veggies.png" alt="" width="40" height="40">                <span class="option-card-title">Vegan</span>
            </span>
                    </span>
    </label>

                                                                                                                                                                                                                                                                                                                                                            <label class="option-card">
        <input type="checkbox" name="diet[]" value="low_carb" class="visually-hidden">
        <span class="option-card-body">
            <span class="option-card-header">
                <img class="option-card-icon" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/icons/low-carb.png" alt="" width="40" height="40">                <span class="option-card-title">Low Carb</span>
            </span>
                    </span>
    </label>

                                                                                                                                                                                                                                                                                                                                                            <label class="option-card">
        <input type="checkbox" name="diet[]" value="paleo" class="visually-hidden">
        <span class="option-card-body">
            <span class="option-card-header">
                <img class="option-card-icon" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/icons/meat.png" alt="" width="40" height="40">                <span class="option-card-title">Paleo</span>
            </span>
                    </span>
    </label>

                                                            </div>
                            <div class="invalid-feedback">Please select an option</div>                        </div>
                                    </form>
            </div>
        </div>
    </div>
                    <div class="onboarding-cta d-flex justify-content-center mt-auto mt-md-5 pt-3 pt-md-0 px-3 w-100">
                                    <button type="submit" form="onboarding-form" class="btn btn-dark onboarding-next-btn" disabled>
                Save            </button>
            </div>
        </main>
    </div>

                <footer class="footer pt-4 mt-3 text-center">
        <div class="container">
            <ul class="footer-links list-unstyled mb-2">
                <li><a href="/faq">FAQ</a></li>
                <li><a href="/contact">Contact Us</a></li>
                <li><a href="/terms">TC</a></li>
            </ul>
            <p class="footer-copyright mb-0 mt-4">&copy;Yumetics all the rights reserved</p>
        </div>
    </footer>

    
        <script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/runtime.b3ae8917.js" defer></script><script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/34.681df9f3.js" defer></script><script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.3888181a.js" defer></script>
</body>
</html>
