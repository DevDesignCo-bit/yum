<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumetics — Select your gender</title>
            <link rel="stylesheet" href="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.2e098a9d.css">
    </head>
<body class="onboarding-page">
    <div class="onboarding-viewport">
                    <header class="onboarding-header pt-4 pt-md-5">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="onboarding-header-slot">
                    <a href="/onboarding/features" class="app-icon-btn" aria-label="Back">
        <span class="icon-arrow icon-arrow-left" aria-hidden="true"></span>
    </a>
            </div>
            <div class="onboarding-header-slot">
                            </div>
        </div>
    </header>


        <main class="onboarding-main flex-grow-1 d-flex flex-column align-items-md-center w-100">
                                
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5 mx-auto">
                <h1 class="onboarding-step-title mt-3 text-center mb-5 pb-3">Select your gender</h1>

                <form id="onboarding-form" method="get" action="/onboarding/age" class="needs-validation block-submit-button-until-form-filled mx-xl-7" novalidate>
                                            <div class="form-field">
                            <div class="option-cards-list" data-required-group>
                                                                                                                                                                                            <label class="option-card">
        <input type="radio" name="gender" value="female" class="visually-hidden" required>
        <span class="option-card-body">
            <span class="option-card-header">
                <img class="option-card-icon" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/icons/female.png" alt="" width="40" height="40">                <span class="option-card-title">Female</span>
            </span>
                    </span>
    </label>

                                                                                                                                                                                            <label class="option-card">
        <input type="radio" name="gender" value="male" class="visually-hidden" required>
        <span class="option-card-body">
            <span class="option-card-header">
                <img class="option-card-icon" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/icons/male.png" alt="" width="40" height="40">                <span class="option-card-title">Male</span>
            </span>
                    </span>
    </label>

                                                                                                                                                                                            <label class="option-card">
        <input type="radio" name="gender" value="non_binary" class="visually-hidden" required>
        <span class="option-card-body">
            <span class="option-card-header">
                <img class="option-card-icon" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/icons/non-binary.png" alt="" width="40" height="40">                <span class="option-card-title">Non-binary</span>
            </span>
                    </span>
    </label>

                                                            </div>
                            <div class="invalid-feedback">Please select an option</div>                        </div>
                                    </form>
            </div>
        </div>
    </div>
                    <div class="onboarding-cta d-flex justify-content-center mt-auto mt-md-5 pt-3 pt-md-0 px-3 w-100">
                                    <button type="submit" form="onboarding-form" class="btn btn-dark onboarding-next-btn" disabled>
                Next <span class="icon-chevron icon-chevron-right" aria-hidden="true"></span>            </button>
            </div>
        </main>
    </div>

                <footer class="footer pt-4 mt-3 text-center">
        <div class="container">
            <ul class="footer-links list-unstyled mb-2">
                <li><a href="/faq">FAQ</a></li>
                <li><a href="/contact">Contact Us</a></li>
                <li><a href="/terms">TC</a></li>
            </ul>
            <p class="footer-copyright mb-0 mt-4">&copy;Yumetics all the rights reserved</p>
        </div>
    </footer>

    
        <script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/runtime.b3ae8917.js" defer></script><script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/34.681df9f3.js" defer></script><script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.3888181a.js" defer></script>
</body>
</html>
