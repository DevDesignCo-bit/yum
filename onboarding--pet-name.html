<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumetics — Say hi to your virtual PET!</title>
            <link rel="stylesheet" href="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.2e098a9d.css">
    </head>
<body class="onboarding-page">
    <div class="onboarding-viewport">
                            <header class="onboarding-header pt-4 pt-md-5">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="onboarding-header-slot">
                    <a href="/onboarding/virtual-pet" class="app-icon-btn" aria-label="Back">
        <span class="icon-arrow icon-arrow-left" aria-hidden="true"></span>
    </a>
            </div>
            <div class="onboarding-header-slot">
                    <a href="/onboarding/summary" class="app-icon-btn" aria-label="Close">
        <span class="icon-close" aria-hidden="true"></span>
    </a>
            </div>
        </div>
    </header>

    
        <main class="onboarding-main flex-grow-1 d-flex flex-column align-items-md-center w-100">
                <div class="container">
        <h1 class="fs-2 fw-black lh-1 text-center mt-3 mb-4 d-md-none">Say hi to your virtual PET!</h1>

        <div class="row align-items-center g-1 g-md-4 g-xxl-5">
            <div class="col-md-6 text-center">
                            <div class="hearts mb-4 d-md-none">
                    <span class="icon-heart icon-heart-filled" aria-hidden="true"></span>
                    <span class="icon-heart icon-heart-filled" aria-hidden="true"></span>
                    <span class="icon-heart icon-heart-filled" aria-hidden="true"></span>
            </div>

                        <picture>
                                                    <source media="(max-width: 767.98px)" srcset="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/pets/pot/illustrations/happy.png">
                                                <img class="onboarding-hero-image mw-450px"
                             src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/pets/pot/illustrations/hero.png"
                             alt=""
                             fetchpriority="high"
                             decoding="async">
                    </picture>
                
            </div>

            <div class="col-md-6 col-xl-5 text-center">
                <h1 class="onboarding-hero-heading mx-lg-4 mx-xxl-0 mb-4 mb-lg-5 mt-lg-5 pt-lg-3 d-none d-md-block">Say hi to your virtual PET!</h1>
                            <div class="hearts mb-4 d-none d-md-block">
                    <span class="icon-heart icon-heart-filled" aria-hidden="true"></span>
                    <span class="icon-heart icon-heart-filled" aria-hidden="true"></span>
                    <span class="icon-heart icon-heart-filled" aria-hidden="true"></span>
            </div>

                    <form id="onboarding-form" method="get" action="/onboarding/water-question" class="needs-validation block-submit-button-until-form-filled d-flex flex-column align-items-center w-md-75 mx-md-auto" novalidate>
        <div class="form-field form-gap w-100">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <label for="pet_name" class="form-label mb-0 fs-18px fw-semibold">Name your PET</label>
                <button type="button" class="btn-random-name" data-random-name>
                    Random name
                    <span class="icon-tile bg-white d-inline-flex align-items-center justify-content-center">
                        <img src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/icons/dice.svg" alt="" width="52">
                    </span>
                </button>
            </div>
            <input type="text" class="form-control mt-2 text-center" name="pet_name" id="pet_name" required maxlength="20" placeholder="Type a name">
            <div class="invalid-feedback">Please enter a name *</div>
        </div>
    </form>
                    <button type="submit" form="onboarding-form" class="btn btn-dark onboarding-next-btn mt-lg-5 d-none d-md-inline-flex" disabled>
        Next <span class="icon-chevron icon-chevron-right" aria-hidden="true"></span>
    </button>
            </div>
        </div>
    </div>
                        <div class="onboarding-cta d-flex justify-content-center mt-auto mt-md-5 pt-3 pt-md-0 px-3 w-100 d-md-none">
                                    <button type="submit" form="onboarding-form" class="btn btn-dark onboarding-next-btn" disabled>
                Next <span class="icon-chevron icon-chevron-right" aria-hidden="true"></span>            </button>
            </div>

        </main>
    </div>

                <footer class="footer pt-4 mt-3 text-center">
        <div class="container">
            <ul class="footer-links list-unstyled mb-2">
                <li><a href="/faq">FAQ</a></li>
                <li><a href="/contact">Contact Us</a></li>
                <li><a href="/terms">TC</a></li>
            </ul>
            <p class="footer-copyright mb-0 mt-4">&copy;Yumetics all the rights reserved</p>
        </div>
    </footer>

    
        <script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/runtime.b3ae8917.js" defer></script><script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/34.681df9f3.js" defer></script><script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.3888181a.js" defer></script>
</body>
</html>
