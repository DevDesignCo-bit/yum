<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumetics Store</title>
            <link rel="stylesheet" href="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.2e098a9d.css">
    </head>
<body class="landing-page">
    <div class="min-vh-100 d-flex flex-column align-items-center position-relative overflow-hidden">
        <div class="text-center pt-3 pt-xl-4 pb-5 mt-xl-4">
            <img src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/logo.svg" alt="Yumetics" style="width: 8.5rem">
        </div>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-6 col-lg-4 text-center mt-5 pt-1">
                    <h1 class="fw-black fs-35px fs-xl-1 lh-1 mb-5 pb-4">Login in to Yumetics</h1>

                    <form method="get" action="/onboarding" class="needs-validation form-pill" novalidate>
                        <div class="form-field form-gap">
                            <label class="form-label text-center w-100" for="phone">Enter your phone number:</label>
                            <input type="tel" class="form-control text-center" placeholder="+48 xxx xxx xxxx" name="phone" id="phone" required>
                            <div class="invalid-feedback">Please enter a valid phone number *</div>
                        </div>

                        <button type="submit" class="btn btn-dark mt-4">Continue</button>
                    </form>

                    <div class="mt-4 d-flex justify-content-center">
                        <div class="g-recaptcha"
     data-callback="capcha_filled"
     data-expired-callback="capcha_expired"
     data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>

                    </div>
                </div>
            </div>
        </div>

        <div class="right-bottom-decor rtl-flip">
            <img src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/mascot-big.svg" alt="" class="img-fluid">
        </div>
    </div>
        <script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/runtime.b3ae8917.js" defer></script><script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/34.681df9f3.js" defer></script><script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.3888181a.js" defer></script>

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script>
    let allowSubmit = false;
    function capcha_filled() { allowSubmit = true; }
    function capcha_expired() { allowSubmit = false; }
</script>

</body>
</html>
