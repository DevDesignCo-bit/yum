<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yumetics — Demo code</title>
  <link rel="stylesheet" href="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.2e098a9d.css">
</head>
<body class="landing-page">
  <div class="min-vh-100 d-flex flex-column align-items-center position-relative overflow-hidden">
    <div class="text-center pt-3 pt-xl-4 pb-5 mt-xl-4">
      <img src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/logo.svg" alt="Yumetics" style="width: 8.5rem">
    </div>
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4 text-center mt-4 pt-1">
          <h1 class="fw-black fs-35px fs-xl-1 lh-1 mb-4">Enter your demo code</h1>
          <p class="mb-4" data-demo-method>Continue to your Yumetics onboarding.</p>
          <form class="needs-validation form-pill" data-demo-pin-form novalidate>
            <div class="form-field form-gap">
              <label class="form-label text-center w-100" for="demo-code">Use any 4 digits (optional in demo)</label>
              <input id="demo-code" class="form-control text-center" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="1234" autocomplete="one-time-code">
            </div>
            <a href="/onboarding" class="demo-entry-continue mt-4">Continue to onboarding</a>
          </form>
          <a href="/onboarding" class="d-inline-block mt-4 text-primary fw-semibold text-decoration-none">Start onboarding without a code</a>
          <p class="small text-body-muted mt-4 mb-0">Demo only — no SMS, payment or personal data is sent.</p>
        </div>
      </div>
    </main>
    <div class="right-bottom-decor rtl-flip">
      <img src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/mascot-big.svg" alt="" class="img-fluid">
    </div>
  </div>
  <script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/runtime.b3ae8917.js" defer></script>
  <script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/34.681df9f3.js" defer></script>
  <script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.3888181a.js" defer></script>
</body>
</html>
