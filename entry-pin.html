<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yumetics — PIN verification</title>
  <link rel="stylesheet" href="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.2e098a9d.css">
</head>
<body class="landing-page">
  <div class="min-vh-100 d-flex flex-column align-items-center position-relative overflow-hidden">
    <div class="text-center pt-3 pt-xl-4 pb-5 mt-xl-4">
      <img src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/logo.svg" alt="Yumetics" style="width: 8.5rem">
    </div>
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4 text-center mt-4 pt-1">
          <h1 class="fw-black fs-35px fs-xl-1 lh-1 mb-3">Enter PIN</h1>
          <p class="mb-4" data-pin-context>Enter the 4-digit PIN to continue.</p>
          <form class="needs-validation form-pill" data-pin-form novalidate>
            <div class="form-field form-gap">
              <label class="form-label text-center w-100" for="pin-digit-1">PIN code</label>
              <div class="pin-row" aria-label="Four digit PIN">
                <input id="pin-digit-1" class="pin-digit" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="First PIN digit">
                <input class="pin-digit" inputmode="numeric" maxlength="1" aria-label="Second PIN digit">
                <input class="pin-digit" inputmode="numeric" maxlength="1" aria-label="Third PIN digit">
                <input class="pin-digit" inputmode="numeric" maxlength="1" aria-label="Fourth PIN digit">
              </div>
            </div>
          </form>
          <a href="/onboarding" class="entry-continue mt-4">Verify PIN &amp; continue</a>
          <a href="/onboarding" class="d-inline-block mt-4 text-primary fw-semibold text-decoration-none">Skip PIN and start onboarding</a>
        </div>
      </div>
    </main>
    <div class="right-bottom-decor rtl-flip">
      <img src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/mascot-big.svg" alt="" class="img-fluid">
    </div>
  </div>
  <script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/runtime.b3ae8917.js" defer></script>
  <script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/34.681df9f3.js" defer></script>
  <script src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/app.3888181a.js" defer></script>
</body>
</html>
