<!doctype html>
<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontakt | Yumetics</title>
    <link rel="stylesheet" href="/de.css">
    <link rel="stylesheet" href="/de-contact.css">
  </head>
  <body class="de-contact-page">
    <main class="de-shell">
      <header class="de-top"><a class="de-top__link" href="/de/home" aria-label="Yumetics Startseite"><img class="de-top__brand" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/app/logo-white.svg" alt="Yumetics"></a><nav class="de-top__nav" aria-label="Hauptnavigation"><a href="/de/home">Startseite</a><a href="/de/stats">Statistik</a><a href="/de/cooking-planner">Essensplan</a><a href="/de/profile">Mein Profil</a></nav><img class="de-top__mascot" src="https://yumetics-store-cdn-dev.s3.eu-west-1.amazonaws.com/cme-1306/ltr/images/pets/pot/navbar.svg" alt=""></header>
      <section class="de-contact-hero">
        <a class="de-back" href="/de" aria-label="Zurück zur Startseite"><img src="/assets/de/back-button-container.png" alt=""></a>
        <h1>Kontakt</h1>
      </section>
      <form class="de-contact-form" id="de-contact-form">
        <h2>Wir sind für Sie da! Wie können wir helfen?</h2>
        <div class="field"><input type="email" required placeholder="E-Mail eingeben: Beispiel@gmail.com" aria-label="E-Mail-Adresse"></div>
        <div class="field"><select required aria-label="Problem auswählen"><option value="">Problem auswählen</option><option>Abonnement</option><option>Technisches Problem</option><option>Feedback</option><option>Sonstiges</option></select></div>
        <div class="field"><textarea placeholder="Beschreiben Sie hier Ihr Problem" aria-label="Nachricht"></textarea></div>
        <label>Anhang</label>
        <div class="de-file"><input id="contact-file-de" type="file"><label for="contact-file-de">Dateien auswählen</label><span id="file-name-de">Keine Datei ausgewählt</span></div>
        <label class="de-captcha"><input type="checkbox" required> Ich bin kein Roboter</label>
        <button class="de-button" type="submit">Senden</button>
        <p class="de-contact-status" role="status"></p>
      </form>
      <footer class="de-footer"><nav class="de-footer__links" aria-label="Rechtliche Informationen"><a href="http://de.mobileinfo.biz/">Abo Verwaltung</a><a href="/de/nutzungsbedingungen">Nutzungsbedingungen</a><a href="/de/widerrufsbelehrung">Widerrufsbelehrung</a><a href="/de/widerrufsformular">Widerrufsformular</a><a href="/de/kontakt">Hilfe &amp; Kontakt</a><a href="/de/impressum">Impressum</a></nav><p class="de-footer__copy">© Yumetics Alle Rechte vorbehalten</p></footer>
    </main>
    <script>const f=document.querySelector('#contact-file-de');f.addEventListener('change',()=>document.querySelector('#file-name-de').textContent=f.files[0]?.name||'Keine Datei ausgewählt');document.querySelector('#de-contact-form').addEventListener('submit',e=>{e.preventDefault();e.currentTarget.querySelector('.de-contact-status').textContent='Danke. Deine Nachricht wurde gesendet.';});</script>
  </body>
</html>
